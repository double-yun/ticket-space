services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: dev
    command: pnpm exec next dev --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
      - .env.local
    environment:
      ANVIL_RPC_URL: http://anvil:8545
    volumes:
      - ./web:/app/web
      - ./db:/app/db
      - pnpm-store:/root/.local/share/pnpm/store
      - node-modules:/app/web/node_modules
    depends_on:
      - anvil
  anvil:
    build:
      context: ./anvil
      dockerfile: Dockerfile
    command: >-
      --host 0.0.0.0 --port 8545 --chain-id 31337
      --state /data/anvil-state.json --state-interval 5
    ports:
      - "8545:8545"
    volumes:
      - ./anvil/contracts:/workspace/contracts
      - anvil-data:/data
volumes:
  pnpm-store:
  node-modules:
  anvil-data:
