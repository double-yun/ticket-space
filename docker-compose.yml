services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "pnpm run db:studio & pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
      - "5555:5555"
    env_file:
      - .env
    volumes:
      - .:/app
      - pnpm-store:/root/.local/share/pnpm/store
      - node-modules:/app/node_modules
volumes:
  pnpm-store:
  node-modules:
